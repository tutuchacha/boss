# 聘聊后端 · 通用配置（契约见 docs/api-contract.md）
spring:
  application:
    name: pinliao-backend
  profiles:
    active: local
  jackson:
    time-zone: UTC
  # ── AI（Step 4）────────────────────────────────────────────
  # OpenAI 兼容协议指向阿里云百炼 compatible-mode（实测 base-url + /v1/chat/completions 可用）。
  # 密钥 / 地址 / 模型全部由环境变量注入，改这一处即可（见 backend/README.md「AI 配置」）：
  #   PINLIAO_AI_API_KEY / PINLIAO_AI_BASE_URL / PINLIAO_AI_CHAT_MODEL /
  #   PINLIAO_AI_EMBEDDING_MODEL / PINLIAO_AI_EMBEDDING_DIM / PINLIAO_AI_ENABLED
  # api-key 给占位默认值：未配密钥时应用仍能正常启动，AI 功能由 pinliao.ai.enabled 关闭。
  ai:
    openai:
      api-key: ${PINLIAO_AI_API_KEY:pinliao-ai-disabled-placeholder}
      base-url: ${PINLIAO_AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      chat:
        options:
          model: ${PINLIAO_AI_CHAT_MODEL:qwen3.5-122b-a10b}
          temperature: 0.3
      embedding:
        options:
          model: ${PINLIAO_AI_EMBEDDING_MODEL:text-embedding-v4}
          dimensions: ${PINLIAO_AI_EMBEDDING_DIM:1024}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs

pinliao:
  ai:
    # AI 总开关（默认关：无密钥的机器 / CI 不受影响；本地演示用 PINLIAO_AI_ENABLED=true 打开）
    enabled: ${PINLIAO_AI_ENABLED:false}
    # 向量来源：springai = 真实上游；fake = 本地确定性假向量（单测 / 冒烟，零费用）
    provider: ${PINLIAO_AI_PROVIDER:springai}
    # 单块正文上限（含标题），超出按句切分并续写（T-AI1）
    chunk-max-chars: ${PINLIAO_AI_CHUNK_MAX_CHARS:800}
    # 单次嵌入请求条数上限（百炼 text-embedding-v4 ≤10）
    embedding-batch-size: ${PINLIAO_AI_EMBEDDING_BATCH_SIZE:10}
    # 单简历问答（T-AI2）：检索 topK / 最低相似度 / 生成 token 上限 / 每 HR 每日次数上限
    qa-top-k: ${PINLIAO_AI_QA_TOP_K:6}
    qa-min-score: ${PINLIAO_AI_QA_MIN_SCORE:0.2}
    qa-max-tokens: ${PINLIAO_AI_QA_MAX_TOKENS:700}
    qa-daily-limit: ${PINLIAO_AI_QA_DAILY_LIMIT:100}
    # 语义人才检索（T-AI4）：返回候选人数上限 / 最低余弦相似度（低于该值不出现在结果里）
    search-top-k: ${PINLIAO_AI_SEARCH_TOP_K:8}
    search-min-score: ${PINLIAO_AI_SEARCH_MIN_SCORE:0.15}
  auth:
    # HS256 签名密钥（≥32 字节）；生产用环境变量 PINLIAO_AUTH_SECRET 覆盖
    secret: ${PINLIAO_AUTH_SECRET:pinliao-local-dev-secret-0123456789abcdef}
    # 契约 §2.1：accessToken 2h、refreshToken 30d
    access-ttl: 2h
    refresh-ttl: 30d
    # 演示语义：验证码固定 123456、5 分钟有效、同手机号 60s 限发一次
    sms:
      fixed-code: "123456"
      ttl: 5m
      cooldown: 60s
  message:
    # 演示语义：聊天自动回复延迟（对齐 mock TYPING_DELAY_MS=1200ms）
    auto-reply-delay-ms: 1200
  upload:
    # 本地对象目录（演示替代 OSS；target/ 已被 .gitignore 忽略）
    dir: ${PINLIAO_UPLOAD_DIR:target/uploads}
    # 预签名上传 URL 有效期（契约未定具体值；演示 10 分钟）
    url-ttl: 10m

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{40} - %msg%n"
