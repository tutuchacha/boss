<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>聘聊 · 招聘App原型</title>
<style>
:root{
  --bg:#F2F5F5; --surface:#FFFFFF; --desk:#E2E9E9; --ink:#16282A; --sub:#5F7274;
  --line:#E3EAEA; --rule:#C9D5D5; --accent:#00857F; --accent-soft:#DDF2F1; --on-accent:#FFFFFF; --sal:#D63A22;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1718; --surface:#152224; --desk:#081011; --ink:#E6F0F0; --sub:#8FA5A7;
    --line:#243638; --rule:#33494B; --accent:#2BBDB5; --accent-soft:#12302F; --on-accent:#032120; --sal:#FF7A63;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1718; --surface:#152224; --desk:#081011; --ink:#E6F0F0; --sub:#8FA5A7;
  --line:#243638; --rule:#33494B; --accent:#2BBDB5; --accent-soft:#12302F; --on-accent:#032120; --sal:#FF7A63;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;background:var(--desk);scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--desk);color:var(--ink);
  font:15px/1.5 "PingFang SC","HarmonyOS Sans SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select{font:inherit;color:inherit}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#app{position:relative;height:100%;max-width:430px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
@media (min-width:500px){#app{box-shadow:0 0 0 1px var(--line)}}
#view{flex:1;min-height:0;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}

.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
#tabbar{display:flex;flex:none;background:var(--surface);border-top:1px solid var(--line)}
#tabbar button{flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--sub);position:relative}
#tabbar button.on{color:var(--accent);font-weight:600}
.badge{position:absolute;top:6px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--sal);color:#fff;font-size:11px;line-height:16px;text-align:center;font-weight:600}

.head{flex:none;background:var(--surface);padding:10px 14px 0;border-bottom:1px solid var(--line)}
.head.plain{padding:14px 16px 12px}
.head h1{font-size:22px;font-weight:700}
.search-row{display:flex;gap:10px;align-items:center}
.city{display:flex;align-items:center;gap:2px;font-weight:600;min-height:40px}
.city .ic{width:16px;height:16px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:20px;padding:0 14px;height:40px;color:var(--sub)}
.search .ic{width:18px;height:18px}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:15px}
.search:focus-within{outline:2px solid var(--accent)}
.chips-row{display:flex;align-items:center;gap:8px;margin-top:8px}
.chips{flex:1;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 10px}
.chip{flex:none;padding:5px 13px;border-radius:16px;color:var(--sub);font-size:14px;min-height:32px}
.chip.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.chips2{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 0 10px}
.chip.s{font-size:13px;min-height:28px;padding:3px 11px;border:1px solid var(--line)}
.chip.s.on{border-color:var(--accent)}
.filter-btn{flex:none;display:flex;align-items:center;gap:4px;color:var(--sub);font-size:14px;min-height:40px;padding-bottom:8px}
.filter-btn .ic{width:17px;height:17px}
.filter-btn.on{color:var(--accent);font-weight:600}
.filter-btn b{background:var(--accent);color:var(--on-accent);border-radius:9px;min-width:18px;height:18px;line-height:18px;font-size:11px;text-align:center}

.count{padding:10px 16px 6px;font-size:12.5px;color:var(--sub)}
.job{display:block;padding:14px 16px;background:var(--surface);border-bottom:1px solid var(--line);cursor:pointer}
.job:active{background:var(--accent-soft)}
.j1{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.j1 h3{font-size:16.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sal{color:var(--sal);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;flex:none}
.sal.big{font-size:26px;margin-top:4px}
.j2{display:flex;flex-wrap:wrap;margin-top:6px;font-size:12.5px;color:var(--sub)}
.j2 span+span{border-left:1px solid var(--rule);margin-left:8px;padding-left:8px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tags i{font-style:normal;font-size:12px;padding:2px 8px;border-radius:4px;background:var(--bg);color:var(--sub)}
.tags.welfare i{background:none;border:1px solid var(--accent);color:var(--accent)}
.j3{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px}
.j3 .co{font-weight:500}
.j3 .sub,.sub{color:var(--sub)}
.j3 .when{margin-left:auto;color:var(--sub);font-size:12px}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:6px;color:#fff;font-weight:700;flex:none}
.av.round{border-radius:50%}

.empty{padding:56px 28px;text-align:center;color:var(--sub)}
.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
.empty .primary{margin-top:18px}

.page{position:absolute;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;animation:slidein .22s ease-out}
.page.closing{animation:slideout .17s ease-in forwards}
@keyframes slidein{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes slideout{to{transform:translateX(24px);opacity:0}}
.bar{flex:none;display:flex;align-items:center;gap:4px;height:52px;padding:0 6px;background:var(--surface);border-bottom:1px solid var(--line)}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:50%}
.ib.on{color:#E39A00}
.bar-title{flex:1;display:flex;flex-direction:column;min-width:0;line-height:1.3}
.bar-title strong{font-size:16px}
.bar-title small{font-size:12px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-sp{width:44px}

.dh{background:var(--surface);padding:16px}
.dh h1{font-size:22px;line-height:1.3}
.hrcard,.co-blk{display:flex;align-items:center;gap:12px;background:var(--surface);margin-top:8px;padding:14px 16px}
.hrcard small,.co-blk small{display:block;color:var(--sub);font-size:12.5px}
.hrcard .online{margin-left:auto;font-size:12px;color:var(--accent)}
.blk{background:var(--surface);margin-top:8px;padding:16px}
.blk h2{font-size:16px;margin-bottom:4px}
.blk h2:not(:first-child){margin-top:18px}
.blk li{position:relative;padding-left:14px;margin-top:8px;font-size:14.5px}
.blk li::before{content:"";position:absolute;left:0;top:.72em;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.blk p{margin-top:6px;font-size:14.5px}
.cta{flex:none;display:flex;gap:10px;padding:10px 14px;background:var(--surface);border-top:1px solid var(--line)}
.ghost{min-height:46px;padding:0 20px;border:1px solid var(--rule);border-radius:23px;font-size:15px}
.primary{flex:1;min-height:46px;border-radius:23px;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:16px}
.primary.sm{flex:none;min-height:40px;padding:0 22px;font-size:15px}

.jobstrip{flex:none;display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--line);font-size:13px}
.jobstrip .t{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jobstrip .sal{font-size:14px}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.sys{align-self:center;font-size:12px;color:var(--sub);background:var(--line);padding:2px 10px;border-radius:10px}
.m{display:flex;gap:8px;max-width:86%;align-items:flex-start}
.m.me{align-self:flex-end}
.bub{padding:9px 13px;border-radius:12px;background:var(--surface);border:1px solid var(--line);word-break:break-word;white-space:pre-wrap}
.m.me .bub{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.rc strong{display:block}
.rc small{opacity:.85}
.quick{flex:none;display:flex;gap:8px;padding:8px 14px 0;overflow-x:auto;background:var(--surface);scrollbar-width:none;border-top:1px solid var(--line)}
.qchip{flex:none;padding:6px 12px;border:1px solid var(--rule);border-radius:16px;font-size:13.5px;min-height:34px}
.composer{flex:none;display:flex;gap:8px;padding:8px 14px 10px;background:var(--surface)}
.composer input{flex:1;min-width:0;min-height:42px;border-radius:21px;border:1px solid var(--rule);padding:0 16px;background:var(--bg);font-size:16px;outline:none}
.composer input:focus{border-color:var(--accent)}
.send{min-width:64px;border-radius:21px;background:var(--accent);color:var(--on-accent);font-weight:600}

.conv{display:flex;gap:12px;width:100%;padding:14px 16px;background:var(--surface);border-bottom:1px solid var(--line);text-align:left}
.conv .body{flex:1;min-width:0}
.conv .r1{display:flex;justify-content:space-between;align-items:baseline}
.conv .r1 strong{font-size:16px}
.conv time{font-size:12px;color:var(--sub)}
.conv .r2{font-size:12.5px;color:var(--sub)}
.conv .r3{display:flex;align-items:center;gap:8px;margin-top:3px}
.conv .last{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;opacity:.85}
.dot{min-width:18px;height:18px;border-radius:9px;background:var(--sal);color:#fff;font-size:11px;line-height:18px;text-align:center;padding:0 5px;font-weight:600}

.mecard{background:var(--surface);padding:18px 16px}
.mehead{display:flex;gap:14px;align-items:center}
.mehead strong{font-size:20px}
.mehead small{display:block;color:var(--sub)}
.wish{margin-top:14px;padding:10px 12px;background:var(--bg);border-radius:8px;font-size:13.5px}
.stats{display:flex;margin-top:14px}
.stats>*{flex:1;text-align:center;font-size:12.5px;color:var(--sub)}
.stats b{display:block;font-size:20px;color:var(--ink)}
.menu{margin-top:8px;background:var(--surface)}
.menu button{display:flex;align-items:center;width:100%;min-height:52px;padding:0 16px;border-bottom:1px solid var(--line);text-align:left}
.menu button span{margin-left:auto;color:var(--sub);font-size:13.5px}
.foot{padding:20px;text-align:center;font-size:12px;color:var(--sub)}
.resume{background:var(--surface);padding:16px}
.resume h2{font-size:16px;margin:16px 0 6px}
.resume h2:first-child{margin-top:0}
.resume p{font-size:14px;margin-top:4px}

.sheet-wrap{position:absolute;inset:0;z-index:40;background:rgba(0,0,0,.42);display:flex;align-items:flex-end}
.sheet{width:100%;max-height:82%;overflow-y:auto;background:var(--surface);border-radius:16px 16px 0 0;padding:18px 16px 16px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{font-size:17px}
.sheet h3{font-size:13.5px;color:var(--sub);margin:16px 0 8px;font-weight:500}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:7px 14px;border-radius:8px;background:var(--bg);min-height:38px;font-size:14px;border:1px solid transparent}
.opt.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-weight:600}
.sheet .cta{margin:20px -16px -16px}
.field{display:block;margin-top:14px;font-size:13px;color:var(--sub)}
.field input,.field select{display:block;width:100%;margin-top:4px;min-height:44px;border:1px solid var(--rule);border-radius:8px;padding:0 12px;background:var(--bg);font-size:16px}
.toast{position:absolute;left:50%;bottom:76px;transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:20px;font-size:14px;max-width:80%;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  <div id="sheet" class="sheet-wrap" data-a="closesheet" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>
</div>

  const box=$('#joblist');if(!box)return;const l=filtered();
  box.innerHTML=l.length?`<div class="count">共 ${l.length} 个职位${S.sort==='最新'?'，按发布时间排序':`，优先展示「${esc(S.profile.sub)}」相关`}</div>`+l.map(jobRow).join('')
    :`<div class="empty"><strong>没有符合条件的职位</strong>换个关键词，或放宽筛选条件试试。<br><button class="primary sm" data-a="reset">清除搜索和筛选</button></div>`;
}

/* ============ 消息 ============ */
function convRow(c){
  const j=job(c.jobId),ms=c.msgs.filter(m=>m.from!=='sys'),last=ms[ms.length-1];
  const prev=!last?'':last.type==='resume'?'[简历] 已发送在线简历':(last.from==='me'?'我：':'')+last.text;
  return `<button class="conv" data-a="openchat" data-id="${c.jobId}">${avatar(j.hr.name,46,true)}
    <div class="body"><div class="r1"><strong>${esc(j.hr.name)}</strong><time>${tfmt(c.updated)}</time></div>
    <div class="r2">${esc(j.company)} ${esc(j.hr.title)}</div>
    <div class="r3"><span class="last">${esc(prev)}</span>${c.unread?`<span class="dot" aria-label="${c.unread}条未读">${c.unread}</span>`:''}</div></div></button>`;
}
function renderMsgs(){
  const l=Object.values(S.chats).sort((a,b)=>b.updated-a.updated);
  $('#view').innerHTML=`<div class="head plain"><h1>消息</h1></div><div class="scroll">${l.length?l.map(convRow).join(''):
    `<div class="empty"><strong>还没有沟通记录</strong>在职位详情里点「立即沟通」，就能和招聘者聊起来。<br><button class="primary sm" data-a="tab" data-v="jobs">去看职位</button></div>`}</div>`;
}

/* ============ 我的 ============ */
function renderMe(){
  const p=S.profile,th={auto:'跟随系统',light:'浅色',dark:'深色'}[S.theme];
  $('#view').innerHTML=`<div class="head plain"><h1>我的</h1></div><div class="scroll">
  <section class="mecard">
    <div class="mehead">${avatar(p.name,56,true)}<div><strong>${esc(p.name)}</strong><small>${esc(p.status)}</small></div></div>
    <div class="wish">求职期望：${esc(p.sub)}　${esc(p.city)}　${esc(p.salary)}</div>
    <div class="stats"><button data-a="tab" data-v="msgs"><b>${Object.keys(S.chats).length}</b>沟通过</button>
      <button data-a="favs"><b>${S.favs.size}</b>收藏</button><div><b>85%</b>简历完善度</div></div>
  </section>
  <div class="menu">
    <button data-a="resumepage">我的简历<span>预览</span></button>
    <button data-a="wish">求职期望<span>编辑</span></button>
    <button data-a="favs">收藏的职位<span>${S.favs.size} 个</span></button>
    <button data-a="theme">外观<span>${th}</span></button>
    <button data-a="recruiter">切换为招聘者身份<span>即将上线</span></button>
  </div>
  <p class="foot">聘聊 v0.1 前端原型　所有职位与对话均为演示数据</p></div>`;
}

/* ============ 页面栈 ============ */
function pushPage(type,id,html){
  const el=document.createElement('section');el.className='page';el.dataset.type=type;el.dataset.id=id;el.innerHTML=html;
  $('#pages').appendChild(el);stack.push(el);return el;
}
function popPage(){
  const el=stack.pop();if(!el)return;el.classList.add('closing');
  setTimeout(()=>{el.remove();afterPop()},170);
}
function afterPop(){
  refreshTop();renderTabbar();
  if(S.tab==='msgs')renderMsgs();else if(S.tab==='me')renderMe();
}
function refreshTop(){
  const el=stack[stack.length-1];if(!el)return;
  if(el.dataset.type==='job')el.innerHTML=jobHTML(+el.dataset.id);
  if(el.dataset.type==='favs')el.innerHTML=favsHTML();
}
const bar=(title,extra='')=>`<header class="bar"><button class="ib" data-a="back" aria-label="返回">${ic('back')}</button><span class="bar-title"><strong>${title}</strong></span>${extra||'<span class="bar-sp"></span>'}</header>`;

/* 职位详情 */
function jobHTML(id){
  const j=job(id),fav=S.favs.has(id),has=!!S.chats[id];
  const w=[0,1,2,3].map(i=>WELFARE[(id+i)%WELFARE.length]);
  return `${bar('职位详情',`<button class="ib ${fav?'on':''}" data-a="fav" data-id="${id}" aria-label="${fav?'取消收藏':'收藏'}" aria-pressed="${fav}">${ic('star',fav)}</button>`)}
  <div class="scroll">
    <section class="dh"><h1>${esc(j.title)}</h1><div class="sal big">${j.salary}</div>
      <div class="j2"><span>${j.city} ${esc(j.area)}</span><span>${j.exp}</span><span>${j.edu}</span></div>
      <div class="tags">${j.tags.map(t=>`<i>${esc(t)}</i>`).join('')}</div>
      <div class="tags welfare">${w.map(t=>`<i>${t}</i>`).join('')}</div></section>
    <section class="hrcard">${avatar(j.hr.name,44,true)}<div><strong>${esc(j.hr.name)}</strong><small>${esc(j.company)} ${esc(j.hr.title)}</small></div><span class="online">刚刚活跃</span></section>
    <section class="blk"><h2>岗位职责</h2><ul>${RESP[j.cat].map(t=>`<li>${t}</li>`).join('')}</ul>
      <h2>任职要求</h2><ul><li>${expText(j)}${eduText(j)}</li><li>掌握或熟悉：${j.tags.map(esc).join('、')}</li><li>沟通顺畅，责任心强，有良好的团队协作意识</li></ul></section>
    <section class="co-blk">${avatar(j.company,44)}<div><strong>${j.company}</strong><small>${j.industry}　${j.stage}　${j.size}</small></div></section>
    <section class="blk"><h2>工作地点</h2><p>${j.city} ${esc(j.area)}</p><p class="sub">发布于${when(j.days)}</p></section>
  </div>
  <footer class="cta"><button class="ghost" data-a="fav" data-id="${id}">${fav?'已收藏':'收藏'}</button><button class="primary" data-a="chat" data-id="${id}">${has?'继续沟通':'立即沟通'}</button></footer>`;
}
function openJob(id){pushPage('job',id,jobHTML(id))}
function toggleFav(id){
  S.favs.has(id)?(S.favs.delete(id),toast('已取消收藏')):(S.favs.add(id),toast('已收藏'));
  save();refreshTop();
}

/* 收藏、简历 */
function favsHTML(){
  const l=JOBS.filter(j=>S.favs.has(j.id));
  return `${bar('收藏的职位')}<div class="scroll">${l.length?l.map(jobRow).join(''):`<div class="empty"><strong>还没有收藏的职位</strong>在职位详情点右上角的星标，就会出现在这里。</div>`}</div>`;
}
function resumeCard(){const p=S.profile;return `<div class="rc"><strong>${esc(p.name)} 的在线简历</strong><small>${esc(p.sub)}　${esc(p.city)}　期望 ${esc(p.salary)}</small></div>`}
function resumeHTML(){
  const p=S.profile;
  return `${bar('我的简历')}<div class="scroll"><section class="resume">
    <h2>个人信息</h2><p>${esc(p.name)}　${esc(p.status)}</p>
    <h2>求职期望</h2><p>${esc(p.cat)} / ${esc(p.sub)}　${esc(p.city)}　${esc(p.salary)}</p>
    <h2>工作经历</h2><p><strong>某某公司</strong>　${esc(p.sub)}　2022.07 - 2025.08</p><p class="sub">负责相关业务的日常工作，独立完成关键任务并达成目标。</p>
    <h2>教育经历</h2><p>某某大学　本科　2018 - 2022</p>
    <h2>个人优势</h2><div class="tags"><i>沟通协作</i><i>学习能力强</i><i>责任心</i><i>执行力</i></div></section></div>`;
}

/* ============ 聊天 ============ */
function msgsHTML(c){
  return c.msgs.map(m=>{
    if(m.from==='sys')return `<div class="sys">${esc(m.text)}</div>`;
    const body=m.type==='resume'?resumeCard():esc(m.text);
    return `<div class="m ${m.from}"><div class="bub">${body}</div></div>`;
  }).join('');
}
function chatHTML(id){
  const c=S.chats[id],j=job(id);
  return `<header class="bar"><button class="ib" data-a="back" aria-label="返回">${ic('back')}</button>
    <span class="bar-title"><strong>${esc(j.hr.name)}</strong><small class="typing">${esc(j.company)} ${esc(j.hr.title)}</small></span><span class="bar-sp"></span></header>
  <div class="jobstrip"><span class="t">${esc(j.title)}</span><span class="sal">${j.salary}</span><span class="sub">${j.city}</span></div>
  <div class="msgs">${msgsHTML(c)}</div>
  <div class="quick">${['发送简历','请问薪资待遇？','想约个面试'].map(q=>`<button class="qchip" data-a="quick" data-v="${q}">${q}</button>`).join('')}</div>
  <div class="composer"><input class="msgin" type="text" placeholder="输入消息" aria-label="输入消息" autocomplete="off"><button class="send" data-a="send">发送</button></div>`;
}
function chatEl(id){return stack.find(p=>p.dataset.type==='chat'&&+p.dataset.id===id)}
function refreshChat(id){
  const el=chatEl(id);if(!el)return;const j=job(id);
  const box=$('.msgs',el);box.innerHTML=msgsHTML(S.chats[id]);box.scrollTop=box.scrollHeight;
  $('.typing',el).textContent=typing.has(id)?'对方正在输入…':`${j.company} ${j.hr.title}`;
}
function openChat(id){
  const top=stack[stack.length-1];
  if(top&&top.dataset.type==='chat'&&+top.dataset.id===id)return;
  S.chats[id].unread=0;save();
  const el=pushPage('chat',id,chatHTML(id));const b=$('.msgs',el);b.scrollTop=b.scrollHeight;renderTabbar();
}
function startChat(id){
  const j=job(id);
  if(!S.chats[id]){
    const g=`您好，我对「${j.title}」很感兴趣，方便聊聊吗？`;
    S.chats[id]={jobId:id,unread:0,updated:Date.now(),msgs:[{from:'sys',text:`你已向 ${j.hr.name} 发起沟通`},{from:'me',text:g}]};
    save();openChat(id);hrReply(id,g);
  }else openChat(id);
}
function addMsg(id,from,text,type){
  const c=S.chats[id];c.msgs.push({from,text,type});c.updated=Date.now();
  const top=stack[stack.length-1],viewing=top&&top.dataset.type==='chat'&&+top.dataset.id===id;
  if(from==='hr'&&!viewing){c.unread++;toast(`${job(id).hr.name} 回复了你`)}
  save();refreshChat(id);renderTabbar();if(S.tab==='msgs')renderMsgs();
}
function hrReply(id,userText){
  const j=job(id);let r;
  if(/简历/.test(userText))r='收到您的简历了，我先和用人部门同步一下，有结果第一时间通知您。';
  else if(/薪|工资|待遇/.test(userText))r=`这个岗位的薪资范围是 ${j.salary}，${j.sMax>=30?'另有年终奖和长期激励':'含绩效奖金'}，具体会根据面试表现确定。`;
  else if(/面试|约/.test(userText))r='可以的，您本周三或周四下午方便吗？确认后我给您发面试邀请。';
  else r='您好，请问您现在的工作状态是？大概什么时候可以到岗呢？';
  typing.add(id);refreshChat(id);
  setTimeout(()=>{typing.delete(id);addMsg(id,'hr',r)},1200);
}
function sendFrom(el,text){
  const id=+el.dataset.id;const t=(text??$('.msgin',el).value).trim();if(!t)return;
  if(t==='发送简历'){addMsg(id,'me','我发送了在线简历','resume');hrReply(id,'简历')}
  else{addMsg(id,'me',t);hrReply(id,t)}
  const inp=$('.msgin',el);if(inp&&text===undefined){inp.value='';inp.focus()}
}

/* ============ 底部弹层 ============ */
function openSheet(html){const s=$('#sheet');s.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;s.hidden=false}
function closeSheet(){$('#sheet').hidden=true;$('#sheet').innerHTML=''}
function citySheet(){
  openSheet(`<h2>选择城市</h2><div class="opts" style="margin-top:14px">${CITIES.map(c=>`<button class="opt ${c===S.city?'on':''}" data-a="setcity" data-v="${c}">${c}</button>`).join('')}</div>`);
}
function filterSheetHTML(){
  const g=(t,k,a)=>`<h3>${t}</h3><div class="opts">${a.map(v=>`<button class="opt ${tmp[k]===v?'on':''}" data-a="opt" data-g="${k}" data-v="${v}">${v}</button>`).join('')}</div>`;
  return `<h2>筛选职位</h2>${g('排序','sort',['推荐','最新'])}${g('经验要求','exp',EXPS)}${g('薪资范围','sal',SALS)}
  <div class="cta"><button class="ghost" data-a="freset">重置</button><button class="primary" data-a="fapply">查看结果</button></div>`;
}
function wishSheet(){
  const p=S.profile,opt=(arr,cur)=>arr.map(c=>`<option ${c===cur?'selected':''}>${c}</option>`).join('');
  openSheet(`<h2>求职期望</h2>
  <label class="field">职位类别<select id="wg">${opt(Object.keys(TREE),p.cat)}</select></label>
  <label class="field">期望职位<select id="wp">${opt(TREE[p.cat],p.sub)}</select></label>
  <label class="field">期望城市<select id="wc">${opt(CITIES.slice(1),p.city)}</select></label>
  <label class="field">期望薪资<select id="wsal">${opt(['5K以下','5-10K','10-20K','20-30K','30-50K','50K以上'],p.salary)}</select></label>
  <div class="cta"><button class="ghost" data-a="closesheet">取消</button><button class="primary" data-a="wsave">保存</button></div>`);
}

/* ============ 事件 ============ */
const H={
  tab:(e,v)=>{stack.length=0;$('#pages').innerHTML='';switchTab(v)},
  job:(e,v,id)=>openJob(id),
  city:()=>citySheet(),
  setcity:(e,v)=>{S.city=v;save();closeSheet();renderJobs()},
  cat:(e,v)=>{S.cat=v;S.sub='全部';renderJobs()},
  sub:(e,v)=>{S.sub=v;renderJobs()},
  filter:()=>{tmp={sort:S.sort,exp:S.exp,sal:S.sal};openSheet(filterSheetHTML())},
  opt:(e)=>{tmp[e.dataset.g]=e.dataset.v;$('#sheet .sheet').innerHTML=filterSheetHTML()},
  freset:()=>{tmp={sort:'推荐',exp:'不限',sal:'不限'};$('#sheet .sheet').innerHTML=filterSheetHTML()},
  fapply:()=>{Object.assign(S,tmp);closeSheet();renderJobs()},
  reset:()=>{Object.assign(S,{q:'',cat:'全部',sub:'全部',exp:'不限',sal:'不限',sort:'推荐'});renderJobs()},
  back:()=>popPage(),
  fav:(e,v,id)=>toggleFav(id),
  chat:(e,v,id)=>startChat(id),
  openchat:(e,v,id)=>openChat(id),
  send:()=>sendFrom(stack[stack.length-1]),
  quick:(e,v)=>sendFrom(stack[stack.length-1],v),
  favs:()=>pushPage('favs',0,favsHTML()),
  resumepage:()=>pushPage('resume',0,resumeHTML()),
  wish:()=>wishSheet(),
  wsave:()=>{Object.assign(S.profile,{cat:$('#wg').value,sub:$('#wp').value,city:$('#wc').value,salary:$('#wsal').value});save();closeSheet();toast('求职期望已保存');renderMe()},
  theme:()=>{S.theme={auto:'light',light:'dark',dark:'auto'}[S.theme];applyTheme();save();renderMe()},
  recruiter:()=>toast('招聘者端将在后续版本上线'),
  closesheet:()=>closeSheet(),
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  if(el.dataset.a==='closesheet'&&el.id==='sheet'&&e.target!==el)return;
  const f=H[el.dataset.a];if(f)f(el,el.dataset.v,+el.dataset.id);
});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;renderList()}});
document.addEventListener('change',e=>{if(e.target.id==='wg')$('#wp').innerHTML=TREE[e.target.value].map(c=>`<option>${c}</option>`).join('')});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.classList.contains('msgin')&&!e.isComposing){e.preventDefault();sendFrom(stack[stack.length-1]);return}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="button"][data-a]')){e.preventDefault();e.target.click();return}
  if(e.key==='Escape'){$('#sheet').hidden?popPage():closeSheet()}
});

load();applyTheme();switchTab('jobs');
</script>
</body>
</html>
