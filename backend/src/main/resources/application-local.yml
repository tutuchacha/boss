# 本地开发环境：项目专用 MySQL 实例（端口 3307，数据在仓库 .local/）与 Redis（6379）
# 起停脚本：backend/scripts/dev-up.ps1 / dev-down.ps1（或 db-start / redis-start 单独起）
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3307/pinliao?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: "123456"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-init-sql: "SET time_zone = '+00:00'"
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 3s
  flyway:
    locations: classpath:db/migration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
