# 聘聊后端 · 通用配置（契约见 docs/api-contract.md）
spring:
  application:
    name: pinliao-backend
  profiles:
    active: local
  jackson:
    time-zone: UTC

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs

pinliao:
  auth:
    # HS256 签名密钥（≥32 字节）；生产用环境变量 PINLIAO_AUTH_SECRET 覆盖
    secret: ${PINLIAO_AUTH_SECRET:pinliao-local-dev-secret-0123456789abcdef}
    # 契约 §2.1：accessToken 2h、refreshToken 30d
    access-ttl: 2h
    refresh-ttl: 30d
    # 演示语义：验证码固定 123456、5 分钟有效、同手机号 60s 限发一次
    sms:
      fixed-code: "123456"
      ttl: 5m
      cooldown: 60s

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{40} - %msg%n"
